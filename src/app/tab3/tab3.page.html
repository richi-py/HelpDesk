<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Perfil
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-grid>
    <div class="encabezado">
      <ion-row class="profile-header ion-text-center ion-padding-vertical">
        <ion-col size="6">
          <ion-avatar class="avatar">
            <img alt="Usuario" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
          </ion-avatar>
        </ion-col>
        <ion-col size="6" class="ion-text-left">
          <h2>Juan Martínez</h2>
          <p class="text">Usuario</p>
        </ion-col>
      </ion-row>
    </div>
  </ion-grid>


  <ion-list lines="none" class="menu">

    <ion-item button id="open-modal-datos">
      <ion-icon slot="start" name="person-outline"></ion-icon>
      <ion-label>Mis datos</ion-label>
      <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
    </ion-item>

    <ion-item>
      <ion-icon slot="start" name="settings-outline"></ion-icon>
      <ion-label>Modo oscuro</ion-label>
      <ion-toggle slot="end"></ion-toggle>
    </ion-item>

    <ion-item button routerLink="/notificaciones">
      <ion-icon slot="start" name="notifications-outline"></ion-icon>
      <ion-label>Notificaciones</ion-label>
      <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
    </ion-item>

    <ion-item (click)="pageLogin()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      <ion-label>Cerrar sesión</ion-label>
      <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
    </ion-item>
  </ion-list>


  <ion-modal trigger="open-modal-datos" #modalDatos>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Editar Mis Datos</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="modalDatos.dismiss()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding ion-background-white">
        <div class="ion-padding-top">
          <ion-item class="ion-margin-bottom" fill="outline">
            <ion-input label="Nombre:" labelPlacement="floating" value="Juan Martínez"></ion-input>
          </ion-item>

          <ion-item class="ion-margin-bottom" fill="outline">
            <ion-input label="Teléfono" labelPlacement="floating" type="tel" value="+52 55 1234 5678"></ion-input>
          </ion-item>

          <ion-button expand="block" class="ion-margin-top" (click)="modalDatos.dismiss()">Guardar cambios</ion-button>
        </div>
      </ion-content>
  </ion-modal>

</ion-content>
