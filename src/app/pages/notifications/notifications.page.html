<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Notificaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <div class="notification">
      <ion-row class="profile-header ion-text-center ion-padding-vertical">
        <ion-col size="4">
          <div class="icono">
            <img alt="Usuario" src="https://cdn-icons-png.flaticon.com/512/8916/8916325.png" />
          </div>
        </ion-col>
        <ion-col size="8" class="ion-text-left">
          <h4>Tu incidencia #INC-6512 cambió a -En proceso-.</h4>
          <p class="text">Hace 2h</p>
        </ion-col>
      </ion-row>
    </div>
    <div class="notification">
      <ion-row class="profile-header ion-text-center ion-padding-vertical">
        <ion-col size="4">
          <div class="icono">
            <img alt="Usuario" src="https://cdn-icons-png.flaticon.com/512/4015/4015897.png" />
          </div>
        </ion-col>
        <ion-col size="8" class="ion-text-left">
          <h4>Se agregó un comentario en la incidencia #INC-6512.</h4>
          <p class="text">Hace 1 día</p>
        </ion-col>
      </ion-row>
    </div>
    <div class="notification">
      <ion-row class="profile-header ion-text-center ion-padding-vertical">
        <ion-col size="4">
          <div class="icono">
            <img alt="Usuario" src="https://marketplace.canva.com/4y2Vw/MAEvqo4y2Vw/1/tl/canva-checkmark-flat-icon-MAEvqo4y2Vw.png" />
          </div>
        </ion-col>
        <ion-col size="8" class="ion-text-left">
          <h4>Tu incidencia #INC-6512 fue resuleta.</h4>
          <p class="text">Hace 1 día</p>
        </ion-col>
      </ion-row>
    </div>
    <div class="notification">
      <ion-row class="profile-header ion-text-center ion-padding-vertical">
        <ion-col size="4">
          <div class="icono">
            <img alt="Usuario" src="https://cdn-icons-png.flaticon.com/512/4015/4015897.png" />
          </div>
        </ion-col>
        <ion-col size="8" class="ion-text-left">
          <h4>Mensaje del soporte: Gracias por tu reporte.</h4>
          <p class="text">Hace 2 días</p>
        </ion-col>
      </ion-row>
    </div>
  </ion-grid>
</ion-content>
